<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>The Place Makers</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#526657; display:flex; align-items:center; justify-content:center; min-height:100vh; font-family:-apple-system,BlinkMacSystemFont,sans-serif; }
  #__loader_status { position:fixed; bottom:20px; right:20px; font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif; color:#666; background:#fff; padding:8px 14px; border-radius:8px; box-shadow:0 1px 4px rgba(0,0,0,0.12); z-index:10000; }
</style>
</head>
<body>
<div id="__loader_status">Loading…</div>
<script>
(async function () {
  var statusEl = document.getElementById('__loader_status');
  function setStatus(msg) { if (statusEl) statusEl.textContent = msg; }
  try {
    var CHUNK_COUNT = 3;
    var parts = [];
    for (var i = 0; i < CHUNK_COUNT; i++) {
      setStatus('Loading part ' + (i + 1) + ' of ' + CHUNK_COUNT + '…');
      var res = await fetch('bundle-parts/chunk-' + i + '.txt');
      if (!res.ok) throw new Error('Failed to fetch chunk ' + i + ': ' + res.status);
      parts.push(await res.text());
    }
    setStatus('Rendering…');
    var full = parts.join('');
    document.open();
    document.write(full);
    document.close();
  } catch (err) {
    setStatus('Error loading site: ' + err.message);
    console.error('[loader] failed to reconstruct bundle:', err);
  }
})();
</script>
</body>
</html>
